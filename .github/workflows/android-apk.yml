name: SOLANA HUNTER Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - solana-hunter/android-app
    paths:
      - 'android/**'
      - 'src/**'
      - 'assets/**'
      - 'locales/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

# Keep only the newest Android build running; Rust cross-compilation is resource-heavy.
concurrency:
  group: solana-hunter-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build bundled Rust core for Android arm64
        env:
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: 2
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --lib -vv
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solana-hunter-local-core-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
