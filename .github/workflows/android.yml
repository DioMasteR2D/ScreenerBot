name: Android APK

on:
  push:
    branches:
      - main
      - android/**
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "android/**"
      - "locales/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  build-android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Rust engine shared library
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --lib --no-default-features

      - name: Verify native library
        run: test -s android/app/src/main/jniLibs/arm64-v8a/libscreenerbot.so

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" > /tmp/screenerbot-apk-badging.txt
          head -n 5 /tmp/screenerbot-apk-badging.txt

      # Exercise the JNI engine on an Android emulator; the phone APK above remains ARM64-only.
      - name: Build emulator-only x86_64 native engine
        run: cargo ndk -t x86_64 -o android/app/src/main/jniLibs build --release --lib --no-default-features

      - name: Run native engine smoke test on Android emulator
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          SYSTEM_IMAGE="system-images;android-35;google_apis;x86_64"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          # sdkmanager exits successfully after accepting the prompt; `yes` then gets SIGPIPE.
          # Disable pipefail for this pipeline so that expected SIGPIPE is not treated as a CI failure.
          set +o pipefail
          yes | "$SDKMANAGER" "$SYSTEM_IMAGE"
          set -o pipefail
          echo no | "$ANDROID_HOME/cmdline-tools/$(ls "$ANDROID_HOME/cmdline-tools" | sort -V | tail -1)/bin/avdmanager" create avd --force -n screenerbot-ci --package "$SYSTEM_IMAGE" --device pixel_2
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd screenerbot-ci -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off > /tmp/screenerbot-emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          adb start-server
          adb -s emulator-5554 wait-for-device
          echo "Waiting for Android boot..."
          for i in $(seq 1 600); do
            BOOT="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOT" = "1" ]; then break; fi
            if [ "$i" -eq 600 ]; then
              cat /tmp/screenerbot-emulator.log
              echo "Emulator boot timed out" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for Android input service..."
          for i in $(seq 1 120); do
            if adb -s emulator-5554 shell service check input 2>&1 | grep -q "found"; then break; fi
            if [ "$i" -eq 120 ]; then
              cat /tmp/screenerbot-emulator.log
              echo "Android input service did not become available" >&2
              exit 1
            fi
            sleep 2
          done
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0.0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0.0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0.0
          cd android
          gradle --no-daemon connectedDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenerBot-Android-ARM64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
