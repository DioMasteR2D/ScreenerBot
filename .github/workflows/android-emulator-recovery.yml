name: Android emulator recovery

on:
  push:
    branches:
      - android/mobile-app-bootstrap
    paths:
      - ".github/workflows/android-emulator-recovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: android-emulator-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-smoke-test:
    name: ARM64 Android emulator smoke test
    # macOS hosted runners expose Hypervisor.framework; Linux hosted runners
    # do not expose /dev/kvm, which made software-emulated Android never boot.
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;arm64-v8a"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download verified ARM64 APK from run 82
        uses: actions/download-artifact@v4
        with:
          name: ScreenerBot-Android-ARM64-debug
          run-id: 45999055132
          github-token: ${{ github.token }}
          path: android/app/build/outputs/apk/debug

      - name: Verify APK and ARM64 JNI library
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libscreenerbot.so'

      - name: Run Android ARM64 emulator smoke test
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name avdmanager -print -quit)"
          SYSTEM_IMAGE="system-images;android-35;google_apis;arm64-v8a"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force -n screenerbot-arm64-ci -k "$SYSTEM_IMAGE" --device pixel_2
          "$EMULATOR" -port 5554 -avd screenerbot-arm64-ci -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto -cores 4 -memory 4096 > /tmp/screenerbot-emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$ADB" start-server

          echo "Waiting up to 180 seconds for emulator ADB registration..."
          DEVICE_READY=0
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited before ADB registration" >&2
              cat /tmp/screenerbot-emulator.log
              exit 1
            fi
            if "$ADB" devices | grep -q '^emulator-5554[[:space:]]*device$'; then DEVICE_READY=1; break; fi
            sleep 2
          done
          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "Emulator did not register with ADB" >&2
            "$ADB" devices -l || true
            cat /tmp/screenerbot-emulator.log
            exit 1
          fi

          echo "Waiting up to 600 seconds for Android boot..."
          BOOT_READY=0
          for i in $(seq 1 300); do
            BOOT="$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOT" = "1" ]; then BOOT_READY=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited during boot" >&2
              cat /tmp/screenerbot-emulator.log
              exit 1
            fi
            sleep 2
          done
          if [ "$BOOT_READY" -ne 1 ]; then
            echo "Android boot timed out" >&2
            cat /tmp/screenerbot-emulator.log
            "$ADB" devices -l || true
            exit 1
          fi

          "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0.0
          "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0.0
          "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0.0
          "$ADB" -s emulator-5554 install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" -s emulator-5554 shell am force-stop io.screenerbot.mobile.debug
          "$ADB" -s emulator-5554 shell monkey -p io.screenerbot.mobile.debug 1
          sleep 30
          "$ADB" -s emulator-5554 shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
          "$ADB" -s emulator-5554 logcat -d -t 3000 > /tmp/screenerbot-logcat.txt
          if grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|Native engine panicked' /tmp/screenerbot-logcat.txt; then
            echo "Fatal Android/JNI startup error detected" >&2
            exit 1
          fi
          cd android
          gradle --no-daemon connectedDebugAndroidTest
